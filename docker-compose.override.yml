services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  worker:
    volumes:
      - ./apps/worker:/app

  web:
    build:
      target: dev
    command: pnpm dev --host
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      # Vite dev-server proxy runs inside the web container, so /api must target
      # the api service by its compose hostname (not localhost).
      - VITE_API_URL=http://api:8000
