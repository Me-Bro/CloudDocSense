services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  worker:
    command: watchmedo auto-restart --directory=./worker --pattern="*.py" --recursive -- celery -A worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./apps/worker:/app
    environment:
      - PYTHONUNBUFFERED=1

  web:
    build:
      target: dev
    command: pnpm dev --host
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      # Vite dev-server proxy runs inside the web container, so /api must target
      # the api service by its compose hostname (not localhost).
      - VITE_API_URL=http://api:8000
