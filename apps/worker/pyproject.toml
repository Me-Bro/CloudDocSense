[project]
name = "docsense-worker"
version = "0.1.0"
description = "DocSense Celery worker"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.0.0",
    "structlog>=24.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "boto3>=1.34.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-postgres>=0.1.0",
    "llama-index-embeddings-openai>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
